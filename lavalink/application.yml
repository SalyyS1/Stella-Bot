server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    password: "stella_lavalink_password"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    # opusEncodingQuality = complexity 0-10, khong phai bitrate.
    opusEncodingQuality: 10
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - WEB
      - TV
      - ANDROID_VR
      - WEBEMBEDDED
    oauth:
      # YouTube chan playback tu IP la (nhat la IP datacenter) bang "Sign in to
      # confirm you're not a bot" / "This video requires login". Co request da
      # dang nhap thi het. Lan start dau tien (chua co token) log se in link
      # google.com/device + code de authorize, xong no in refreshToken ra log.
      # Dat token do vao env YOUTUBE_REFRESH_TOKEN de khong phai lam lai flow
      # moi lan restart. Dung account rac, khong dung account chinh.
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
    remoteCipher:
      # Bo giai ma signature noi bo cua plugin khong theo kip player script cua
      # YouTube, nen day phan deciphering sang yt-cipher. Public instance khong
      # can password. Chi signature di qua day, khong co du lieu nguoi dung.
      url: "https://cipher.kikkia.dev/"
      userAgent: "stella-bot"
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: true
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "VN"
      playlistLoadLimit: 6
      albumLoadLimit: 6

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO

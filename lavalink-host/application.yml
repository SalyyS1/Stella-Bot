server:
  port: ${SERVER_PORT:2333}
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    # SponsorBlock bo doan sponsor/tu quang cao ngay trong video YouTube.
    # Quang cao pre-roll cua YouTube thi Lavalink von khong stream, khong can lo.
    # Neu Lavalink log 404 khi tai plugin nay: doi repository sang
    # https://maven.topi.wtf/releases roi restart.
    - dependency: "com.github.topi314.sponsorblock:sponsorblock-plugin:3.0.1"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: false
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    # Buffer 4s audio cho moi player: it giat khi mang/GC hiccup, doi lai RAM.
    frameBufferDurationMs: 4000
    # opusEncodingQuality = OPUS_SET_COMPLEXITY (0-10), KHONG phai bitrate.
    # Lavaplayer khong set bitrate nen libopus dung OPUS_AUTO ~99kbps.
    opusEncodingQuality: 10
    # Chi anh huong nguon khac 48kHz. HIGH chi nen bat khi it hon 5 player.
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - TV
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    oauth:
      # YouTube chan IP datacenter nen playback bat buoc phai co request da dang nhap.
      # Lan start dau tien (chua co token) log se in link google.com/device + code de authorize,
      # xong no in refreshToken ra log. Dat token do vao env YOUTUBE_REFRESH_TOKEN de khong
      # phai lam lai flow moi lan restart. Dung account rac, khong dung account chinh.
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
    remoteCipher:
      # Bo giai ma signature noi bo cua plugin khong theo kip player script cua YouTube,
      # nen day phan deciphering sang yt-cipher. Public instance khong can password.
      url: "https://cipher.kikkia.dev/"
      userAgent: "stella-bot"
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: true
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "VN"
      playlistLoadLimit: 6
      albumLoadLimit: 6

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO

<head>

    <meta name="robots" content="noindex, nofollow">
    <title>Stella Panel</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center;
               background: #0f1117; color: #e6e6e6;

<body>
    <main>
        <h1>Stella Panel — chưa dựng giao diện</h1>

            Khung HTTP đã chạy (phase 1). Trang này là chỗ giữ vị trí cho bản build của
            Next.js: <code>npm run panel:build</code> ở phase 4 sẽ ghi đè cả thư mục
            <code>web/out</code>.
        </p>
        <p>
            Chưa có đăng nhập và chưa có dữ liệu — phase 2 làm cổng admin, phase 3 làm API.
        </p>
